name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel = Intel (x86_64), macos-14 = Apple Silicon (arm64)
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build app bundle + DMG
        run: bash macos/build.sh
        env:
          # Store the base64-encoded p12 and its password as repository secrets.
          # Generate them once with: bash macos/generate-signing-cert.sh
          # Then add CODESIGN_CERT_P12_BASE64 and CODESIGN_CERT_PASSWORD under
          # Settings → Secrets and variables → Actions.
          CODESIGN_CERT_P12_BASE64: ${{ secrets.CODESIGN_CERT_P12_BASE64 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1
