name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel = Intel (x86_64), macos-14 = Apple Silicon (arm64)
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build app bundle + DMG
        run: bash macos/build.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1
