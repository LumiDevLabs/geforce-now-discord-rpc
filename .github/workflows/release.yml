name: Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build app + installer
        run: .\windows\build.ps1
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            installer/*.exe
          if-no-files-found: error
          retention-days: 1

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel = Intel (x86_64), macos-14 = Apple Silicon (arm64)
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build app bundle + DMG
        run: bash macos/build.sh
        env:
          CODESIGN_CERT_P12_BASE64: ${{ secrets.CODESIGN_CERT_P12_BASE64 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1
